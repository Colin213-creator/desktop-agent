<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面智能体</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2b3442; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--fg); font-family:"Microsoft YaHei",sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  input { flex:1; background:#0a0e14; border:1px solid var(--line); color:var(--fg);
          border-radius:6px; padding:8px 10px; font-size:13px; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button.stop { border-color:#7d2f2f; color:#ff7b72; }
  main { flex:1; display:grid; grid-template-columns:1fr 380px; min-height:0; }
  #screen { display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; }
  #screen img { max-width:100%; max-height:100%; border:1px solid var(--line); border-radius:8px; }
  #log { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto;
         padding:12px; font-family:Consolas,monospace; font-size:12px; line-height:1.7; }
  .row { padding:4px 0; border-bottom:1px dashed #21262d; color:var(--dim); }
  .row b { color:var(--fg); font-weight:500; }
  .ok { color:#3fb950; } .warn { color:#d29922; } .bad { color:#ff7b72; }
</style>
</head>
<body>
<header>
  <h1>桌面智能体</h1>
  <input id="task" placeholder="用一句话描述任务，例如：打开计算器算 1234 乘 5678">
  <button id="run">执行</button>
  <button id="stop" class="stop">急停</button>
</header>
<main>
  <div id="screen"><span style="color:#8b949e">等待任务…</span></div>
  <div id="log"></div>
</main>
<script>
  const log = document.getElementById('log');
  const screen = document.getElementById('screen');

  function line(text, cls) {
    const div = document.createElement('div');
    div.className = 'row ' + (cls || '');
    div.innerHTML = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById('run').onclick = async () => {
    const task = document.getElementById('task').value.trim();
    if (!task) return;
    line('<b>任务：</b>' + task);
    const res = await fetch('/api/task', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task})
    });
    line(res.ok ? '<b>已提交</b>' : '<b class="bad">提交失败</b>');
  };

  document.getElementById('stop').onclick = async () => {
    await fetch('/api/stop', {method: 'POST'});
    line('<b class="bad">已触发急停</b>');
  };

  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const payload = data.payload || {};
      if (payload.screenshot) {
        screen.innerHTML = '<img src="' + payload.screenshot + '" alt="当前屏幕">';
      }
      if (payload.message) {
        line(payload.message, payload.level);
      }
    };
    ws.onclose = () => { line('<span class="warn">连接断开，3 秒后重连</span>'); setTimeout(connect, 3000); };
  }
  connect();
</script>
</body>
</html>
